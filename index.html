<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HTX Company</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:ital,opsz,wght@0,9..40,200;0,9..40,300;0,9..40,400;1,9..40,200&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
html { scroll-behavior: smooth; }

:root {
  --bg: #080808;
  --cell: #0d0d0d;
  --border: rgba(255,255,255,0.07);
  --white: #ececec;
  --muted: rgba(236,236,236,0.35);
  --dim: rgba(236,236,236,0.14);
}

body {
  background: var(--bg);
  color: var(--white);
  font-family: 'DM Sans', sans-serif;
  min-height: 100vh;
  overflow-x: hidden;
}

/* ── GRID BACKGROUND ── */
.grid-bg {
  position: fixed;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  background-image:
    linear-gradient(rgba(255,255,255,0.055) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,0.055) 1px, transparent 1px);
  background-size: 48px 48px;
  /* gradient mask: visible top-center, fades to black edges + bottom */
  -webkit-mask-image: radial-gradient(ellipse 70% 55% at 50% 30%, black 0%, transparent 100%);
  mask-image: radial-gradient(ellipse 70% 55% at 50% 30%, black 0%, transparent 100%);
}

/* ── LAYOUT ── */
.page {
  position: relative;
  z-index: 1;
  max-width: 960px;
  margin: 0 auto;
  padding: 0 24px 60px;
}

/* ── TOPBAR ── */
.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 28px 0 0;
  border-bottom: 1px solid var(--border);
  padding-bottom: 20px;
}
.logo-mark {
  font-family: 'Syne', sans-serif;
  font-weight: 800;
  font-size: 15px;
  letter-spacing: 0.12em;
  color: var(--white);
  opacity: 0.9;
}
.year-tag {
  font-size: 11px;
  letter-spacing: 0.3em;
  color: var(--muted);
  font-weight: 200;
}

/* ── HERO BENTO ── */
.bento {
  display: grid;
  gap: 1px;
  background: var(--border);
  border: 1px solid var(--border);
  margin-top: 1px;
}

/* Hero row */
.bento-hero {
  grid-template-columns: 1fr;
}
.cell-hero {
  background: var(--cell);
  padding: 64px 48px 52px;
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  gap: 0;
  position: relative;
  overflow: hidden;
}
/* faint inner glow top-left */
.cell-hero::before {
  content: '';
  position: absolute;
  top: -80px; left: -80px;
  width: 360px; height: 360px;
  background: radial-gradient(circle, rgba(255,255,255,0.04) 0%, transparent 65%);
  pointer-events: none;
}
.hero-eyebrow {
  font-size: 10px;
  letter-spacing: 0.38em;
  color: var(--muted);
  font-weight: 300;
  text-transform: uppercase;
  margin-bottom: 20px;
}
.hero-title {
  font-family: 'Syne', sans-serif;
  font-weight: 800;
  font-size: clamp(56px, 10vw, 108px);
  letter-spacing: -0.03em;
  line-height: 0.92;
  color: var(--white);
}
.hero-company {
  font-family: 'Syne', sans-serif;
  font-weight: 700;
  font-size: clamp(14px, 2.2vw, 20px);
  letter-spacing: 0.3em;
  color: var(--muted);
  text-transform: uppercase;
  margin-top: 10px;
}
.hero-tagline {
  font-size: clamp(11px, 1.4vw, 13px);
  letter-spacing: 0.18em;
  color: var(--dim);
  font-weight: 200;
  text-transform: uppercase;
  margin-top: 32px;
}
.tg-btn {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  margin-top: 36px;
  padding: 12px 32px;
  background: rgba(200,200,200,0.1);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 8px;
  color: rgba(236,236,236,0.75);
  font-family: 'DM Sans', sans-serif;
  font-size: 12px;
  font-weight: 300;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  text-decoration: none;
  transition: background 0.3s, border-color 0.3s, color 0.3s;
  width: fit-content;
}
.tg-btn:hover {
  background: rgba(200,200,200,0.18);
  border-color: rgba(255,255,255,0.22);
  color: var(--white);
}
.tg-btn svg { opacity: 0.5; flex-shrink: 0; }

/* ── INFO SECTION ── */
.section-label {
  font-size: 10px;
  letter-spacing: 0.4em;
  color: var(--muted);
  text-transform: uppercase;
  font-weight: 300;
  padding: 28px 0 20px;
}

/* 2-col info grid */
.bento-info {
  grid-template-columns: 1fr 1fr;
}

.cell {
  background: var(--cell);
  padding: 28px 28px 28px;
  display: flex;
  flex-direction: row;
  align-items: center;
  justify-content: space-between;
  min-height: 100px;
  position: relative;
  overflow: hidden;
  transition: background 0.25s;
  text-decoration: none;
  color: inherit;
  cursor: pointer;
}
.cell:hover { background: #131313; }

.cell-num {
  font-size: 9px;
  letter-spacing: 0.35em;
  color: var(--dim);
  font-weight: 300;
  margin-bottom: 14px;
}
.cell-name {
  font-family: 'Syne', sans-serif;
  font-weight: 700;
  font-size: 15px;
  letter-spacing: 0.01em;
  color: var(--white);
  line-height: 1.25;
  white-space: nowrap;
}
.cell-desc {
  font-size: 11px;
  letter-spacing: 0.06em;
  color: var(--muted);
  font-weight: 200;
  margin-top: 8px;
  line-height: 1.7;
}
.cell-arrow {
  position: absolute;
  top: 16px;
  right: 16px;
  font-size: 12px;
  color: var(--dim);
  transition: color 0.25s, transform 0.25s;
}
.cell:hover .cell-arrow {
  color: rgba(255,255,255,0.35);
  transform: translate(2px,-2px);
}

/* ── CELL ICONS ── */
.cell-icon {
  position: absolute;
  right: 20px;
  bottom: 20px;
  opacity: 0.15;
  pointer-events: none;
}
.hero-cards-icon {
  position: absolute;
  bottom: 20px;
  right: 28px;
  opacity: 0.13;
  pointer-events: none;
  display: flex;
  gap: 8px;
}

/* ── FOOTER ── */
footer {
  border-top: 1px solid var(--border);
  margin-top: 1px;
  padding: 22px 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.footer-left {
  font-family: 'Syne', sans-serif;
  font-weight: 700;
  font-size: 11px;
  letter-spacing: 0.18em;
  color: var(--dim);
}
.footer-right {
  font-size: 10px;
  letter-spacing: 0.25em;
  color: var(--dim);
  font-weight: 200;
}

@media (max-width: 560px) {
  .bento-info { grid-template-columns: 1fr; }
  .cell-hero { padding: 44px 24px 40px; }
  footer { flex-direction: column; gap: 8px; text-align: center; }
}
</style>
</head>
<body>

</body>
</html>
